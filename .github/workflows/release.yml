name: Release

# Prebuilt libraries for the platforms a consumer is likely to be on, attached
# to a GitHub Release. CI proves the code; this ships it. It runs on a version
# tag, and on demand to rehearse the packaging without cutting a release - the
# tarballs are then workflow artifacts and the release job is skipped.
#
# A release is: bump STARKBANK_VERSION in include/starkbank.h, move the
# CHANGELOG's Unreleased entries under the version, merge, tag v<version> on
# master, push the tag. The dist jobs refuse a tag that does not match the
# header, so a release can never carry a library that reports another version.
#
# Linux is built inside an Ubuntu 22.04 container rather than on the runner's
# own image, so the shared libraries need glibc 2.35 rather than whatever
# ubuntu-latest carries this month; it is its own job because a container is
# a job-level setting. macOS is built on both architectures. Windows is built
# with MinGW-w64 in the runner's preinstalled MSYS2 (UCRT64), which yields
# starkbank.dll and starkbank_full.dll with import libraries and .def files
# plus the static archives for GCC and Clang hosts; there is no curl bundle
# there, and MSVC remains compile-only in CI because core-c has no MSVC build.
#
# The sibling checkouts read with the same two tokens CI uses; see ci.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CORE_C_REF: v0.1.1
  ECDSA_C_REF: v0.1.0

jobs:
  dist-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      # The container starts bare: no git for the checkout, no compiler. perl
      # brings shasum, which writes the checksum beside the tarball. Ubuntu
      # 22.04's libsecp256k1 package is 0.1, whose SECP256K1_CONTEXT_NONE cannot
      # sign, so the bundle would carry a library that fails every request;
      # libsecp256k1 is built from source instead, at the same version the
      # Windows job uses.
      - name: Container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates cmake libcurl4-openssl-dev perl

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: The tag names the version the header reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^#define STARKBANK_VERSION ' starkbank/sdk-c/include/starkbank.h | cut -d'"' -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match STARKBANK_VERSION ${version}" >&2
            exit 1
          }

      - name: libsecp256k1, static, with the recovery module
        run: |
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 secp256k1-src
          cmake -S secp256k1-src -B secp256k1-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_CTIME_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/secp256k1-prefix"
          cmake --build secp256k1-build
          cmake --install secp256k1-build

      - name: Build the siblings
        run: |
          prefix="$PWD/secp256k1-prefix"
          make -C starkbank/ecdsa-c SECP256K1_PREFIX="$prefix" CFLAGS="-O2 -fPIC"
          make -C starkinfra/core-c SECP256K1_PREFIX="$prefix"
          make -C starkinfra/core-c SECP256K1_PREFIX="$prefix" curl

      - name: Library, suites, bundles and the release tarball
        run: |
          prefix="$PWD/secp256k1-prefix"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" CFLAGS="-O2 -Werror"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" test
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" dist
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" check-exports

      - name: What went into it
        run: |
          cd starkbank/sdk-c/dist
          cat *.sha256
          tar -tzf *.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-x86_64
          path: |
            starkbank/sdk-c/dist/*.tar.gz
            starkbank/sdk-c/dist/*.tar.gz.sha256
          if-no-files-found: error

  dist-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: darwin-arm64
          - os: macos-15-intel
            label: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: Install libsecp256k1
        run: brew install secp256k1

      - name: The tag names the version the header reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^#define STARKBANK_VERSION ' starkbank/sdk-c/include/starkbank.h | cut -d'"' -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match STARKBANK_VERSION ${version}" >&2
            exit 1
          }

      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c CFLAGS="-O2 -fPIC"
          make -C starkinfra/core-c
          make -C starkinfra/core-c curl

      - name: Library, suites, bundles and the release tarball
        run: |
          make -C starkbank/sdk-c CFLAGS="-O2 -Werror"
          make -C starkbank/sdk-c test
          make -C starkbank/sdk-c dist
          make -C starkbank/sdk-c check-exports

      - name: What went into it
        run: |
          cd starkbank/sdk-c/dist
          cat *.sha256
          tar -tzf *.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.label }}
          path: |
            starkbank/sdk-c/dist/*.tar.gz
            starkbank/sdk-c/dist/*.tar.gz.sha256
          if-no-files-found: error

  dist-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: MinGW-w64 toolchain
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja make git perl

      - name: libsecp256k1, static, with the recovery module
        run: |
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 secp256k1-src
          cmake -S secp256k1-src -B secp256k1-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_CTIME_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/secp256k1-prefix"
          cmake --build secp256k1-build
          cmake --install secp256k1-build

      - name: The tag names the version the header reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^#define STARKBANK_VERSION ' starkbank/sdk-c/include/starkbank.h | cut -d'"' -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match STARKBANK_VERSION ${version}" >&2
            exit 1
          }

      # secp256k1.h declares its API __declspec(dllimport) on Windows unless
      # SECP256K1_STATIC is defined; against the static archive built above,
      # ecdsa-c's objects would otherwise ask the linker for __imp_secp256k1_*.
      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c SECP256K1_PREFIX="$PWD/secp256k1-prefix" CFLAGS="-O2 -DSECP256K1_STATIC"
          make -C starkinfra/core-c SECP256K1_PREFIX="$PWD/secp256k1-prefix"

      - name: Library, suites, DLLs and the release tarball
        run: |
          prefix="$PWD/secp256k1-prefix"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" CFLAGS="-O2 -Werror"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" test
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" dist
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" check-exports

      - name: What went into it
        run: |
          cd starkbank/sdk-c/dist
          cat *.sha256
          tar -tzf *.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-x86_64
          path: |
            starkbank/sdk-c/dist/*.tar.gz
            starkbank/sdk-c/dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [dist-linux, dist-macos, dist-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # gh is on every runner and uses the workflow token, so no third-party
      # release action is needed - the repository's Actions policy would refuse
      # one anyway. A re-run of the same tag replaces the assets in place.
      - name: Create or update the release and attach the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          {
            echo "Prebuilt libraries of starkbank ${tag#v}. Every tarball holds \`include/starkbank.h\`,"
            echo "\`lib/libstarkbank.a\` (for a C host that links core-c, ecdsa-c and libsecp256k1 itself),"
            echo "\`lib/libstarkbank_full.*\` (static and shared, with core-c, ecdsa-c and libsecp256k1 inside;"
            echo "no HTTP - the host supplies a transport), \`lib/libstarkbank_full_curl.*\` (the same with"
            echo "core-c's libcurl transport, linking the system libcurl), relocatable pkg-config files, and"
            echo "the C# and Delphi bindings. Linux needs glibc 2.35 or newer; Windows is MinGW-w64/UCRT, with"
            echo ".dll, import libraries and .def files and no curl bundle. Verify a download with"
            echo "\`shasum -a 256 -c <file>.sha256\`."
            echo
            echo "| asset | platform |"
            echo "|---|---|"
            for file in dist/*.tar.gz; do
              name=$(basename "$file")
              platform=${name#starkbank-c-*-}
              echo "| \`${name}\` | ${platform%.tar.gz} |"
            done
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "starkbank ${tag#v}" --notes-file notes.md --generate-notes
          fi
