name: CI

on:
  push:
    branches: [master]
  pull_request:

# sdk-c links libstarkcore and libstarkecdsa from sibling checkouts, the layout
# the Makefile's CORE_PREFIX and ECDSA_PREFIX defaults already expect on a
# developer machine. Both are pinned to tags rather than tracking a branch, so
# a green build names a fixed dependency revision.
#
# The sibling checkouts are private while the C programme is unannounced, and
# the automatic GITHUB_TOKEN is scoped to this repository, so the cross-repository
# checkouts read with STARK_SIBLINGS_TOKEN (fine-grained, owner starkbank,
# contents:read on ecdsa-c and app-docs) and STARK_INFRA_TOKEN (owner starkinfra,
# contents:read on core-c), falling back to the automatic token once public. A fork PR has neither and stays red.
env:
  CORE_C_REF: v0.1.1
  ECDSA_C_REF: v0.1.0
  # The drift checker reads sdk-python at the sha tests/reference/sdk-python.sha
  # pins and app-docs at its default branch. Neither is imported and neither is
  # written; both are inputs.
  SDK_PYTHON_REF: master
  APP_DOCS_REF: development

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: Install libsecp256k1, libcurl and valgrind
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libsecp256k1-dev libcurl4-openssl-dev valgrind
          else
            brew install secp256k1
          fi

      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c CFLAGS="-O2 -fPIC"
          make -C starkinfra/core-c
          make -C starkinfra/core-c curl

      - name: Library, under the full warning set with -Werror
        run: make -C starkbank/sdk-c CFLAGS="-O2 -Werror"

      - name: Offline suites
        run: |
          make -C starkbank/sdk-c test
          make -C starkbank/sdk-c test-loose
          make -C starkbank/sdk-c test-abi

      # STARKBANK_GATE_CFFI is what lets the gate create its venv and install
      # cffi. It is opt-in precisely so no local `make check-header` reaches
      # PyPI on its own; CI is where that is expected, so CI asks for it.
      - name: Public header gate - C89, C++98, cffi, emitted artifacts
        env:
          STARKBANK_GATE_CFFI: "1"
        run: make -C starkbank/sdk-c check-header

      - name: Python tool unit cases
        run: make -C starkbank/sdk-c check-tools

      - name: Exported symbols, shared and static
        run: |
          make -C starkbank/sdk-c bundle
          make -C starkbank/sdk-c check-exports

      - name: The linker-enforced hand-written opt-out
        run: make -C starkbank/sdk-c check-handwritten

      - name: Docs samples compile with -Werror
        run: make -C starkbank/sdk-c samples

      - name: Single-artifact bundle, with and without the libcurl transport
        run: |
          make -C starkbank/sdk-c bundle
          make -C starkbank/sdk-c bundle-curl
          make -C starkbank/sdk-c check-exports

      # release.yml cannot be rehearsed from a branch, so the tarball is built
      # here too; the release job builds it in an Ubuntu 22.04 container.
      - name: Release tarball for this platform
        run: |
          make -C starkbank/sdk-c dist
          ls -la starkbank/sdk-c/dist/*/lib

      - name: Install into a staging prefix
        run: make -C starkbank/sdk-c install DESTDIR=/tmp/stage PREFIX=/usr/local

      - name: Address and undefined-behaviour sanitizers
        run: make -C starkbank/sdk-c asan

      - name: Leaks
        run: make -C starkbank/sdk-c leaks

  # A data race is not a memory error, so the asan job cannot see one, and tsan
  # cannot be combined with asan in a single binary.
  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: Install libsecp256k1 and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev clang

      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c CFLAGS="-O2 -fPIC"
          make -C starkinfra/core-c

      - name: One client, eight threads
        run: make -C starkbank/sdk-c tsan CC=clang

  # The tables are derived from sdk-python and are never a source of truth. This
  # is the job that keeps "derived" true, and a release tag is gated on it: see
  # make check-drift-pinned. It also re-derives tests/reference/slice.json,
  # because check-drift reads the tables and the docs only: without the
  # recorder running here, the goldens that hold every funds-movement request
  # payload are a frozen file anyone can hand-edit until the slice goes green.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: Check out sdk-python at the pinned sha
        run: |
          git clone --no-checkout https://github.com/starkbank/sdk-python.git starkbank/sdk-python
          git -C starkbank/sdk-python checkout \
            "$(grep -v '^#' starkbank/sdk-c/tests/reference/sdk-python.sha | head -1)"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/app-docs
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.APP_DOCS_REF }}
          path: starkbank/app-docs

      # The recorder imports these three and nothing else. No pip install:
      # they go on sys.path as checkouts, exactly as they do locally.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-python
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          path: starkinfra/core-python

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-python
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          path: starkbank/ecdsa-python

      - name: Install libsecp256k1
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev

      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c CFLAGS="-O2 -fPIC"
          make -C starkinfra/core-c

      - name: Tables against sdk-python and the docs JSON
        run: make -C starkbank/sdk-c check-drift-pinned

      - name: Goldens re-recorded from sdk-python at the pin
        run: make -C starkbank/sdk-c check-goldens

  # Windows is the least-tested surface at launch and gets its own job for that
  # reason. It compiles only: core-c has no Windows build, so there is nothing
  # to link against yet, and a compile of every translation unit under
  # /TC /W4 /permissive- is what catches the C99-isms, the long, and the
  # declaration-after-statement this header and these sources must not have.
  #
  # RED until the sibling repositories are reachable, exactly like every other
  # job here. It is committed now so the Windows evidence starts accumulating
  # the day they are, rather than being discovered at release.
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Public header as its own translation unit
        shell: cmd
        run: |
          cd starkbank\sdk-c
          echo #include "starkbank.h" > %TEMP%\header.c
          echo int main(void) { return starkbank_abi_version(); } >> %TEMP%\header.c
          cl /nologo /TC /W4 /permissive- /c /Iinclude /I..\..\starkinfra\core-c\include %TEMP%\header.c /Fo%TEMP%\header.obj

      - name: Every source under /TC /W4 /permissive-
        shell: cmd
        run: |
          cd starkbank\sdk-c
          cl /nologo /TC /W4 /permissive- /c /Iinclude /Istarkc /Istarkbank /I..\..\starkinfra\core-c\include /I..\ecdsa-c\include starkc\*.c handwritten\*.c /Fo%TEMP%\
          for /d %%d in (starkbank\*) do cl /nologo /TC /W4 /permissive- /c /Iinclude /Istarkc /Istarkbank /I..\..\starkinfra\core-c\include /I..\ecdsa-c\include %%d\*.c /Fo%TEMP%\\

  # The GCC route to Windows: MinGW-w64 in the runner's preinstalled MSYS2,
  # UCRT64 environment. This is the job that proves a DLL and the static
  # archives exist for Windows at all; MSVC builds are compile-only above,
  # because core-c has no MSVC build to link. libsecp256k1 has no MSYS2
  # package, so it is built from source with the recovery module ecdsa-c uses.
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: starkbank/sdk-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkinfra/core-c
          token: ${{ secrets.STARK_INFRA_TOKEN || secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.CORE_C_REF }}
          path: starkinfra/core-c

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: starkbank/ecdsa-c
          token: ${{ secrets.STARK_SIBLINGS_TOKEN || github.token }}
          ref: ${{ env.ECDSA_C_REF }}
          path: starkbank/ecdsa-c

      - name: MinGW-w64 toolchain
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja make git perl
          gcc --version | head -1

      - name: libsecp256k1, static, with the recovery module
        run: |
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 secp256k1-src
          cmake -S secp256k1-src -B secp256k1-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_CTIME_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/secp256k1-prefix"
          cmake --build secp256k1-build
          cmake --install secp256k1-build

      # secp256k1.h declares its API __declspec(dllimport) on Windows unless
      # SECP256K1_STATIC is defined; against the static archive built above,
      # ecdsa-c's objects would otherwise ask the linker for __imp_secp256k1_*.
      - name: Build the siblings
        run: |
          make -C starkbank/ecdsa-c SECP256K1_PREFIX="$PWD/secp256k1-prefix" CFLAGS="-O2 -DSECP256K1_STATIC"
          make -C starkinfra/core-c SECP256K1_PREFIX="$PWD/secp256k1-prefix"

      - name: Library, suites, DLLs, exports and the tarball
        run: |
          prefix="$PWD/secp256k1-prefix"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" CFLAGS="-O2 -Werror"
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" test
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" shared bundle
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" check-exports
          make -C starkbank/sdk-c SECP256K1_PREFIX="$prefix" dist
          ls -la starkbank/sdk-c/dist/*/lib

      # What check-exports reads, kept visible so a binutils format change
      # is diagnosed from the log rather than from a second run.
      - name: The export table as objdump prints it
        if: always()
        run: objdump -p starkbank/sdk-c/starkbank.dll | sed -n '/Ordinal Base/,+3p'
